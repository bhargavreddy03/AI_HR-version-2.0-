[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "ai-hr-backend"
version = "2.0.0"
description = "AI-Powered Recruitment & HR Intelligence Platform - Modular Monolith API"
authors = ["AI HR Architecture Team"]
license = "Proprietary"
readme = "../README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
pydantic = "^2.7.0"
pydantic-settings = "^2.2.0"
sqlalchemy = "^2.0.30"
alembic = "^1.13.1"
asyncpg = "^0.29.0"
psycopg2-binary = "^2.9.9"
pgvector = "^0.2.5"
redis = "^6.1.0"
celery = "^5.4.0"
httpx = "^0.27.0"
python-multipart = "^0.0.9"
argon2-cffi = "^23.1.0"
pyjwt = "^2.8.0"
cryptography = "^42.0.7"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.6"
pytest-cov = "^5.0.0"
ruff = "^0.4.4"
mypy = "^1.10.0"
types-redis = "^4.6.0.20240425"

[tool.pytest.ini_options]
asyncio_mode = "strict"
markers = [
    "integration: Integration tests requiring live PostgreSQL or Redis services",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # do not perform function calls in argument defaults (FastAPI Depends)
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["tests/", "alembic/"]

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.core.celery_app", "app.core.celery_health", "app.core.tasks.*", "app.modules.*.tasks"]
disallow_untyped_calls = false
disallow_untyped_decorators = false
