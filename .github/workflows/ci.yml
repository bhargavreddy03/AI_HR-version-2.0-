name: Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-lint-and-test:
    name: Backend CI (FastAPI & Python 3.11)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ai_hr_db_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_super_password_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_hr_db_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run Ruff Linting & Formatting Check
        run: |
          cd backend
          ruff check app tests
          ruff format --check app tests

      - name: Run Mypy Type Checking
        run: |
          cd backend
          mypy app/

      - name: Initialize PostgreSQL Roles and Extensions (Fresh Run)
        env:
          POSTGRES_SUPERUSER: postgres
          POSTGRES_SUPERUSER_PASSWORD: test_super_password_only
          PGPASSWORD: test_super_password_only
          POSTGRES_MIGRATION_USER: aihr_migration_user
          POSTGRES_MIGRATION_PASSWORD: local_development_migration_password_only
          POSTGRES_USER: aihr_app_user
          POSTGRES_PASSWORD: local_development_password_only
          POSTGRES_DB: ai_hr_db_test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
        run: |
          bash infrastructure/scripts/init-db.sh

      - name: Verify PostgreSQL Initialization Idempotency (Rerun on Running Server)
        env:
          POSTGRES_SUPERUSER: postgres
          POSTGRES_SUPERUSER_PASSWORD: test_super_password_only
          PGPASSWORD: test_super_password_only
          POSTGRES_MIGRATION_USER: aihr_migration_user
          POSTGRES_MIGRATION_PASSWORD: local_development_migration_password_only
          POSTGRES_USER: aihr_app_user
          POSTGRES_PASSWORD: local_development_password_only
          POSTGRES_DB: ai_hr_db_test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
        run: |
          bash infrastructure/scripts/init-db.sh

      - name: Run Pytest Test Suite
        env:
          ENVIRONMENT: testing
          POSTGRES_DB: ai_hr_db_test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_SUPERUSER: postgres
          POSTGRES_SUPERUSER_PASSWORD: test_super_password_only
          PGPASSWORD: test_super_password_only
          POSTGRES_USER: aihr_app_user
          POSTGRES_PASSWORD: local_development_password_only
          POSTGRES_MIGRATION_USER: aihr_migration_user
          POSTGRES_MIGRATION_PASSWORD: local_development_migration_password_only
          DATABASE_URL: postgresql+asyncpg://aihr_app_user:local_development_password_only@localhost:5432/ai_hr_db_test
          DATABASE_MIGRATION_URL: postgresql+asyncpg://aihr_migration_user:local_development_migration_password_only@localhost:5432/ai_hr_db_test
          DATABASE_SYNC_URL: postgresql://aihr_migration_user:local_development_migration_password_only@localhost:5432/ai_hr_db_test
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/1
          CELERY_RESULT_BACKEND: redis://localhost:6379/2
        run: |
          cd backend
          pytest -v --cov=app --cov-report=term-missing

  frontend-lint-and-typecheck:
    name: Frontend CI (Next.js 14 & Node.js 20)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Node Dependencies
        run: |
          cd frontend
          npm install

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint

      - name: Run TypeScript Type Check
        run: |
          cd frontend
          npm run typecheck

      - name: Run Vitest Frontend Unit Tests
        run: |
          cd frontend
          npm run test

      - name: Build Frontend (Next.js Standalone)
        run: |
          cd frontend
          npm run build

  infrastructure-and-docker-validation:
    name: Infrastructure & Container Validation
    runs-on: ubuntu-latest
    needs: [backend-lint-and-test, frontend-lint-and-typecheck]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration Rejects Missing Secrets
        run: |
          cp .env.example .env
          if docker compose --env-file .env -f infrastructure/docker/docker-compose.yml config > /dev/null 2>&1; then
            echo "ERROR: docker compose config should have failed on .env.example due to missing required secrets!"
            exit 1
          else
            echo "SUCCESS: docker compose config correctly rejected missing required secrets."
          fi

      - name: Validate Docker Compose Development Configuration
        run: |
          cp .env.dev.example .env.dev
          docker compose --env-file .env.dev -f infrastructure/docker/docker-compose.yml -f infrastructure/docker/docker-compose.dev.yml config --quiet
          echo "SUCCESS: Development compose config validated successfully."

      - name: Validate Docker Compose Production Configuration With Secrets
        run: |
          cat << 'EOF' > .env
          ENVIRONMENT=production
          POSTGRES_DB=ai_hr_db
          POSTGRES_USER=aihr_app_user
          POSTGRES_PASSWORD=mock_production_password_min_32_chars_123
          POSTGRES_MIGRATION_USER=aihr_migration_user
          POSTGRES_MIGRATION_PASSWORD=mock_production_migration_password_32_chars
          POSTGRES_SUPERUSER=postgres
          POSTGRES_SUPERUSER_PASSWORD=mock_production_superuser_password_32_chars
          DATABASE_URL=postgresql+asyncpg://aihr_app_user:mock_production_password_min_32_chars_123@postgres:5432/ai_hr_db
          DATABASE_MIGRATION_URL=postgresql+asyncpg://aihr_migration_user:mock_production_migration_password_32_chars@postgres:5432/ai_hr_db
          DATABASE_SYNC_URL=postgresql://aihr_migration_user:mock_production_migration_password_32_chars@postgres:5432/ai_hr_db
          JWT_SECRET_KEY=mock_production_jwt_secret_key_minimum_32_chars
          MFA_ENCRYPTION_KEY=mock_production_mfa_encryption_key_minimum_32
          BACKUP_CODE_PEPPER=mock_production_backup_code_pepper_minimum_32
          REDIS_PASSWORD=mock_production_redis_password_minimum_32_chars
          REDIS_URL=redis://:mock_production_redis_password_minimum_32_chars@redis:6379/0
          CELERY_BROKER_URL=redis://:mock_production_redis_password_minimum_32_chars@redis:6379/1
          CELERY_RESULT_BACKEND=redis://:mock_production_redis_password_minimum_32_chars@redis:6379/2
          COOKIE_SECURE=true
          EOF
          docker compose --env-file .env -f infrastructure/docker/docker-compose.yml config --quiet
          echo "SUCCESS: Production compose config validated successfully with explicit secrets."

      - name: Smoke Test Docker Compose Stack Startup, Port Isolation, and Security
        run: |
          set -euo pipefail
          dump_logs_on_exit() {
            local exit_code=$?
            if [ $exit_code -ne 0 ]; then
              echo "=== SMOKE TEST FAILED (exit code $exit_code) - DUMPING CONTAINER LOGS ==="
              docker compose --env-file .env.dev -f infrastructure/docker/docker-compose.yml -f infrastructure/docker/docker-compose.dev.yml logs --tail=100 || true
            fi
            docker compose --env-file .env.dev -f infrastructure/docker/docker-compose.yml -f infrastructure/docker/docker-compose.dev.yml down -v --remove-orphans || true
          }
          trap dump_logs_on_exit EXIT

          echo "Ensuring executable permissions on container entrypoint scripts..."
          chmod +x backend/entrypoint.sh infrastructure/scripts/init-db.sh

          echo "Starting complete 5-service dev stack (postgres, redis, backend, celery_worker, frontend)..."
          docker compose --env-file .env.dev -f infrastructure/docker/docker-compose.yml -f infrastructure/docker/docker-compose.dev.yml up -d --build

          echo "Waiting for PostgreSQL container to become healthy..."
          PG_READY=false
          for i in $(seq 1 45); do
            PG_STATUS=$(docker inspect --format='{{json .State.Health.Status}}' ai_hr_postgres 2>/dev/null || echo '""')
            if [ "$PG_STATUS" = '"healthy"' ]; then
              echo "PostgreSQL container is healthy."
              PG_READY=true
              break
            fi
            sleep 1
          done
          [ "$PG_READY" = "true" ] || { echo "ERROR: PostgreSQL container failed to become healthy within 45s timeout!"; docker compose --env-file .env.dev -f infrastructure/docker/docker-compose.yml -f infrastructure/docker/docker-compose.dev.yml logs postgres; exit 1; }

          echo "Waiting for Redis container to become healthy..."
          REDIS_READY=false
          for i in $(seq 1 30); do
            REDIS_STATUS=$(docker inspect --format='{{json .State.Health.Status}}' ai_hr_redis 2>/dev/null || echo '""')
            if [ "$REDIS_STATUS" = '"healthy"' ]; then
              echo "Redis container is healthy."
              REDIS_READY=true
              break
            fi
            sleep 1
          done
          [ "$REDIS_READY" = "true" ] || { echo "ERROR: Redis container failed to become healthy within 30s timeout!"; docker compose --env-file .env.dev -f infrastructure/docker/docker-compose.yml -f infrastructure/docker/docker-compose.dev.yml logs redis; exit 1; }

          echo "Waiting for FastAPI backend container to become healthy..."
          BACKEND_READY=false
          for i in $(seq 1 45); do
            B_STATUS=$(docker inspect --format='{{json .State.Health.Status}}' ai_hr_backend 2>/dev/null || echo '""')
            if [ "$B_STATUS" = '"healthy"' ]; then
              echo "FastAPI backend container is healthy."
              BACKEND_READY=true
              break
            fi
            sleep 1
          done
          [ "$BACKEND_READY" = "true" ] || { echo "ERROR: FastAPI backend container failed to become healthy within 45s timeout!"; docker compose --env-file .env.dev -f infrastructure/docker/docker-compose.yml -f infrastructure/docker/docker-compose.dev.yml logs backend; exit 1; }

          echo "Waiting for Celery worker container to become healthy..."
          CW_READY=false
          for i in $(seq 1 45); do
            CW_STATUS=$(docker inspect --format='{{json .State.Health.Status}}' ai_hr_celery_worker 2>/dev/null || echo '""')
            if [ "$CW_STATUS" = '"healthy"' ]; then
              echo "Celery worker container is healthy."
              CW_READY=true
              break
            fi
            sleep 1
          done
          [ "$CW_READY" = "true" ] || { echo "ERROR: Celery worker container failed to become healthy within 45s timeout!"; docker compose --env-file .env.dev -f infrastructure/docker/docker-compose.yml -f infrastructure/docker/docker-compose.dev.yml logs celery_worker; exit 1; }

          echo "Waiting for Next.js frontend container to become healthy..."
          FRONTEND_READY=false
          for i in $(seq 1 60); do
            F_STATUS=$(docker inspect --format='{{json .State.Health.Status}}' ai_hr_frontend 2>/dev/null || echo '""')
            if [ "$F_STATUS" = '"healthy"' ]; then
              echo "Next.js frontend container is healthy."
              FRONTEND_READY=true
              break
            fi
            sleep 1
          done
          [ "$FRONTEND_READY" = "true" ] || { echo "ERROR: Next.js frontend container failed to become healthy within 60s timeout!"; docker compose --env-file .env.dev -f infrastructure/docker/docker-compose.yml -f infrastructure/docker/docker-compose.dev.yml logs frontend; exit 1; }

          DEV_SUPER_PASS="$(grep -E '^POSTGRES_SUPERUSER_PASSWORD=' .env.dev | cut -d= -f2-)"
          DEV_REDIS_PASS="$(grep -E '^REDIS_PASSWORD=' .env.dev | cut -d= -f2-)"
          DEV_SUPER_PASS="${DEV_SUPER_PASS:-local_development_super_password_only}"
          DEV_REDIS_PASS="${DEV_REDIS_PASS:-local_development_redis_secret_only}"

          echo "1. Verifying pgvector extension in ai_hr_db..."
          EXT_CHECK=$(docker compose --env-file .env.dev -f infrastructure/docker/docker-compose.yml -f infrastructure/docker/docker-compose.dev.yml exec -T -e PGPASSWORD="$DEV_SUPER_PASS" postgres psql -U postgres -d ai_hr_db -tA -c "SELECT extname FROM pg_extension WHERE extname = 'vector';")
          if [ "$EXT_CHECK" != "vector" ]; then
            echo "ERROR: pgvector extension not found in ai_hr_db!"
            exit 1
          fi
          echo "pgvector extension verified."

          echo "2. Verifying restricted attributes on migration and app users..."
          ROLES_CHECK=$(docker compose --env-file .env.dev -f infrastructure/docker/docker-compose.yml -f infrastructure/docker/docker-compose.dev.yml exec -T -e PGPASSWORD="$DEV_SUPER_PASS" postgres psql -U postgres -d ai_hr_db -tA -c "SELECT rolname, rolsuper, rolbypassrls, rolcreatedb, rolcreaterole FROM pg_roles WHERE rolname IN ('aihr_migration_user', 'aihr_app_user') ORDER BY rolname;")
          echo "$ROLES_CHECK"
          echo "$ROLES_CHECK" | grep -q "aihr_app_user|f|f|f|f" || { echo "ERROR: aihr_app_user has unexpected privileges!"; exit 1; }
          echo "$ROLES_CHECK" | grep -q "aihr_migration_user|f|f|f|f" || { echo "ERROR: aihr_migration_user has unexpected privileges!"; exit 1; }
          echo "Database user restricted attributes verified."

          echo "3. Verifying runtime app user owns 0 tables..."
          APP_TABLE_COUNT=$(docker compose --env-file .env.dev -f infrastructure/docker/docker-compose.yml -f infrastructure/docker/docker-compose.dev.yml exec -T -e PGPASSWORD="$DEV_SUPER_PASS" postgres psql -U postgres -d ai_hr_db -tA -c "SELECT count(*) FROM pg_tables WHERE tableowner = 'aihr_app_user';")
          if [ "$APP_TABLE_COUNT" != "0" ]; then
            echo "ERROR: aihr_app_user owns $APP_TABLE_COUNT tables; must be 0!"
            exit 1
          fi
          echo "App user owns 0 tables verified."

          echo "4. Verifying Redis authentication (authenticated and unauthenticated)..."
          AUTH_PING=$(docker compose --env-file .env.dev -f infrastructure/docker/docker-compose.yml -f infrastructure/docker/docker-compose.dev.yml exec -T redis redis-cli -a "$DEV_REDIS_PASS" ping 2>&1)
          echo "Authenticated ping response: $AUTH_PING"
          echo "$AUTH_PING" | grep -q "PONG" || { echo "ERROR: Authenticated ping did not return PONG!"; exit 1; }

          UNAUTH_PING=$(docker compose --env-file .env.dev -f infrastructure/docker/docker-compose.yml -f infrastructure/docker/docker-compose.dev.yml exec -T redis redis-cli ping 2>&1 || true)
          echo "Unauthenticated ping response: $UNAUTH_PING"
          echo "$UNAUTH_PING" | grep -q "NOAUTH" || { echo "ERROR: Unauthenticated ping did not fail with NOAUTH!"; exit 1; }
          echo "Redis authentication enforcement verified."

          echo "5. Verifying development stack host port bindings are bound to 127.0.0.1 loopback only..."
          ALL_PORTS=$(docker inspect ai_hr_postgres ai_hr_redis ai_hr_backend ai_hr_frontend --format='{{range $p, $conf := .NetworkSettings.Ports}}{{range $conf}}{{.HostIp}}:{{.HostPort}} {{end}}{{end}}')
          echo "Published host ports: $ALL_PORTS"
          if echo "$ALL_PORTS" | grep -q "0.0.0.0"; then
            echo "ERROR: Insecure wildcard host port binding (0.0.0.0) detected!"
            exit 1
          fi
          echo "$ALL_PORTS" | grep -q "127.0.0.1:5432" || { echo "ERROR: postgres is not bound to 127.0.0.1:5432!"; exit 1; }
          echo "$ALL_PORTS" | grep -q "127.0.0.1:6379" || { echo "ERROR: redis is not bound to 127.0.0.1:6379!"; exit 1; }
          echo "$ALL_PORTS" | grep -q "127.0.0.1:8000" || { echo "ERROR: backend is not bound to 127.0.0.1:8000!"; exit 1; }
          echo "$ALL_PORTS" | grep -q "127.0.0.1:3000" || { echo "ERROR: frontend is not bound to 127.0.0.1:3000!"; exit 1; }
          CW_PORTS=$(docker inspect ai_hr_celery_worker --format='{{range $p, $conf := .NetworkSettings.Ports}}{{range $conf}}{{.HostIp}}:{{.HostPort}} {{end}}{{end}}')
          if [ -n "$CW_PORTS" ]; then
            echo "ERROR: celery_worker must not publish any host ports!"
            exit 1
          fi
          echo "Host loopback port bindings verified for all services."

          echo "6. Verifying FastAPI readiness probe (PostgreSQL + Redis)..."
          READY_RESP=$(curl -fsS http://127.0.0.1:8000/api/v1/health/ready)
          echo "FastAPI readiness response: $READY_RESP"
          echo "$READY_RESP" | grep -q '"status":"ready"' || { echo "ERROR: FastAPI readiness probe not ready!"; exit 1; }
          echo "$READY_RESP" | grep -q '"database":"connected"' || { echo "ERROR: Database not connected!"; exit 1; }
          echo "$READY_RESP" | grep -q '"redis":"connected"' || { echo "ERROR: Redis not connected!"; exit 1; }

          echo "7. Verifying Next.js frontend health probe and container-to-backend communication..."
          F_HEALTH=$(curl -fsS http://127.0.0.1:3000/api/health)
          echo "Frontend health response: $F_HEALTH"
          echo "$F_HEALTH" | grep -q '"status":"healthy"' || { echo "ERROR: Frontend health probe failed!"; exit 1; }
          F_BACKEND=$(curl -fsS http://127.0.0.1:3000/api/backend-health)
          echo "Frontend backend proxy response: $F_BACKEND"
          echo "$F_BACKEND" | grep -q '"status":"connected"' || { echo "ERROR: Frontend cannot reach backend over container network!"; exit 1; }

          echo "8. Verifying Celery worker queue consumption and live task execution..."
          docker compose --env-file .env.dev -f infrastructure/docker/docker-compose.yml -f infrastructure/docker/docker-compose.dev.yml exec -T celery_worker python -m app.core.celery_health --workers --queues
          TASK_RESULT=$(docker compose --env-file .env.dev -f infrastructure/docker/docker-compose.yml -f infrastructure/docker/docker-compose.dev.yml exec -T backend python -c "from app.core.tasks.system import system_ping; res = system_ping.delay('docker-smoke-test'); val = res.get(timeout=10); assert val['status'] == 'pong'; print('CELERY_SMOKE_SUCCESS')")
          echo "$TASK_RESULT" | grep -q "CELERY_SMOKE_SUCCESS" || { echo "ERROR: Celery live task execution failed!"; exit 1; }
          echo "Celery worker queue health and live task execution verified."

          echo "9. Verifying PostgreSQL script rerun idempotency inside running container..."
          docker compose --env-file .env.dev -f infrastructure/docker/docker-compose.yml -f infrastructure/docker/docker-compose.dev.yml exec -T -e POSTGRES_HOST=localhost -e PGPASSWORD="$DEV_SUPER_PASS" postgres bash /docker-entrypoint-initdb.d/01-init.sh
          echo "PostgreSQL initialization script rerun inside container verified successfully."

          echo "SUCCESS: All 5 container services started, verified healthy, and passed all integration and security checks."

      - name: Teardown Docker Compose Development Stack
        if: always()
        run: |
          docker compose --env-file .env.dev -f infrastructure/docker/docker-compose.yml -f infrastructure/docker/docker-compose.dev.yml down -v --remove-orphans || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: ai-hr/backend:ci-test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: ai-hr/frontend:ci-test
