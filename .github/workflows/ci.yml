name: Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-lint-and-test:
    name: Backend CI (FastAPI & Python 3.11)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ai_hr_db_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_super_password_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_hr_db_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run Ruff Linting & Formatting Check
        run: |
          cd backend
          ruff check app tests
          ruff format --check app tests

      - name: Run Mypy Type Checking
        run: |
          cd backend
          mypy app/

      - name: Initialize PostgreSQL Roles and Extensions
        env:
          POSTGRES_SUPERUSER: postgres
          POSTGRES_SUPERUSER_PASSWORD: test_super_password_only
          PGPASSWORD: test_super_password_only
          POSTGRES_MIGRATION_USER: aihr_migration_user
          POSTGRES_MIGRATION_PASSWORD: local_development_migration_password_only
          POSTGRES_USER: aihr_app_user
          POSTGRES_PASSWORD: local_development_password_only
          POSTGRES_DB: ai_hr_db_test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
        run: |
          bash infrastructure/scripts/init-db.sh

      - name: Run Pytest Test Suite
        env:
          ENVIRONMENT: testing
          POSTGRES_DB: ai_hr_db_test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_SUPERUSER: postgres
          POSTGRES_SUPERUSER_PASSWORD: test_super_password_only
          PGPASSWORD: test_super_password_only
          POSTGRES_USER: aihr_app_user
          POSTGRES_PASSWORD: local_development_password_only
          POSTGRES_MIGRATION_USER: aihr_migration_user
          POSTGRES_MIGRATION_PASSWORD: local_development_migration_password_only
          DATABASE_URL: postgresql+asyncpg://aihr_app_user:local_development_password_only@localhost:5432/ai_hr_db_test
          DATABASE_MIGRATION_URL: postgresql+asyncpg://aihr_migration_user:local_development_migration_password_only@localhost:5432/ai_hr_db_test
          DATABASE_SYNC_URL: postgresql://aihr_migration_user:local_development_migration_password_only@localhost:5432/ai_hr_db_test
        run: |
          cd backend
          pytest -v --cov=app --cov-report=term-missing

  frontend-lint-and-typecheck:
    name: Frontend CI (Next.js 14 & Node.js 20)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint

      - name: Run TypeScript Type Check
        run: |
          cd frontend
          npm run typecheck

      - name: Build Frontend (Next.js Standalone)
        run: |
          cd frontend
          npm run build

  infrastructure-and-docker-validation:
    name: Infrastructure & Container Validation
    runs-on: ubuntu-latest
    needs: [backend-lint-and-test, frontend-lint-and-typecheck]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration Rejects Missing Secrets
        run: |
          cp .env.example .env
          if docker compose --env-file .env -f infrastructure/docker/docker-compose.yml config > /dev/null 2>&1; then
            echo "ERROR: docker compose config should have failed on .env.example due to missing required secrets!"
            exit 1
          else
            echo "SUCCESS: docker compose config correctly rejected missing required secrets."
          fi

      - name: Validate Docker Compose Development Configuration
        run: |
          cp .env.dev.example .env.dev
          docker compose --env-file .env.dev -f infrastructure/docker/docker-compose.yml -f infrastructure/docker/docker-compose.dev.yml config --quiet
          echo "SUCCESS: Development compose config validated successfully."

      - name: Validate Docker Compose Production Configuration With Secrets
        run: |
          cat << 'EOF' > .env
          ENVIRONMENT=production
          POSTGRES_DB=ai_hr_db
          POSTGRES_USER=aihr_app_user
          POSTGRES_PASSWORD=mock_production_password_min_32_chars_123
          POSTGRES_MIGRATION_USER=aihr_migration_user
          POSTGRES_MIGRATION_PASSWORD=mock_production_migration_password_32_chars
          POSTGRES_SUPERUSER=postgres
          POSTGRES_SUPERUSER_PASSWORD=mock_production_superuser_password_32_chars
          DATABASE_URL=postgresql+asyncpg://aihr_app_user:mock_production_password_min_32_chars_123@postgres:5432/ai_hr_db
          DATABASE_MIGRATION_URL=postgresql+asyncpg://aihr_migration_user:mock_production_migration_password_32_chars@postgres:5432/ai_hr_db
          DATABASE_SYNC_URL=postgresql://aihr_migration_user:mock_production_migration_password_32_chars@postgres:5432/ai_hr_db
          JWT_SECRET_KEY=mock_production_jwt_secret_key_minimum_32_chars
          MFA_ENCRYPTION_KEY=mock_production_mfa_encryption_key_minimum_32
          BACKUP_CODE_PEPPER=mock_production_backup_code_pepper_minimum_32
          REDIS_PASSWORD=mock_production_redis_password_minimum_32_chars
          REDIS_URL=redis://:mock_production_redis_password_minimum_32_chars@redis:6379/0
          COOKIE_SECURE=true
          EOF
          docker compose --env-file .env -f infrastructure/docker/docker-compose.yml config --quiet
          echo "SUCCESS: Production compose config validated successfully with explicit secrets."

      - name: Smoke Test Docker Compose Stack Startup and Port Isolation
        run: |
          docker compose --env-file .env.dev -f infrastructure/docker/docker-compose.yml -f infrastructure/docker/docker-compose.dev.yml up -d postgres redis
          # Wait up to 30 seconds for postgres and redis to be ready
          for i in {1..30}; do
            if docker compose --env-file .env.dev -f infrastructure/docker/docker-compose.yml -f infrastructure/docker/docker-compose.dev.yml exec -T postgres pg_isready -U postgres > /dev/null 2>&1; then
              echo "Postgres is ready and accepting connections."
              break
            fi
            sleep 1
          done
          # Verify Redis authentication with development secret
          docker compose --env-file .env.dev -f infrastructure/docker/docker-compose.yml -f infrastructure/docker/docker-compose.dev.yml exec -T redis redis-cli -a local_development_redis_secret_only ping
          # Verify teardown
          docker compose --env-file .env.dev -f infrastructure/docker/docker-compose.yml -f infrastructure/docker/docker-compose.dev.yml down -v
          echo "SUCCESS: Container smoke test completed successfully."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: ai-hr/backend:ci-test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: ai-hr/frontend:ci-test
