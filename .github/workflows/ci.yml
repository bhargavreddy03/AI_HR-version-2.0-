name: Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-lint-and-test:
    name: Backend CI (FastAPI & Python 3.11)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ai_hr_db_test
          POSTGRES_USER: aihr_app_user
          POSTGRES_PASSWORD: test_password_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run Ruff Linting & Formatting Check
        run: |
          cd backend
          ruff check app tests
          ruff format --check app tests

      - name: Run Mypy Type Checking
        run: |
          cd backend
          mypy app/

      - name: Run Pytest Test Suite
        env:
          ENVIRONMENT: testing
          POSTGRES_DB: ai_hr_db_test
          POSTGRES_USER: aihr_app_user
          POSTGRES_PASSWORD: test_password_only
          DATABASE_URL: postgresql+asyncpg://aihr_app_user:test_password_only@localhost:5432/ai_hr_db_test
        run: |
          cd backend
          pytest -v --cov=app --cov-report=term-missing

  frontend-lint-and-typecheck:
    name: Frontend CI (Next.js 14 & Node.js 20)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint

      - name: Run TypeScript Type Check
        run: |
          cd frontend
          npm run typecheck

      - name: Build Frontend (Next.js Standalone)
        run: |
          cd frontend
          npm run build

  infrastructure-and-docker-validation:
    name: Infrastructure & Container Validation
    runs-on: ubuntu-latest
    needs: [backend-lint-and-test, frontend-lint-and-typecheck]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose -f infrastructure/docker/docker-compose.yml config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: ai-hr/backend:ci-test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: ai-hr/frontend:ci-test
