services:
  # ----------------------------------------------------------------------------
  # Primary Relational Store: PostgreSQL 16 + pgvector
  # (Ports NOT published in production; accessible only via private network)
  # ----------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai_hr_postgres
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 30s
    networks:
      - ai_hr_network
    env_file:
      - ${ENV_FILE:-../../.env}
    environment:
      ENVIRONMENT: ${ENVIRONMENT:?ENVIRONMENT must be explicitly set}
      POSTGRES_DB: ${POSTGRES_DB:-ai_hr_db}
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?POSTGRES_SUPERUSER_PASSWORD must be set}
      POSTGRES_SUPERUSER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_SUPERUSER_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?POSTGRES_SUPERUSER_PASSWORD must be set}
      POSTGRES_MIGRATION_USER: ${POSTGRES_MIGRATION_USER:-aihr_migration_user}
      POSTGRES_MIGRATION_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD:?POSTGRES_MIGRATION_PASSWORD must be set}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-aihr_app_user}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../scripts/init-db.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
      - ../scripts/init-db.sql:/infrastructure/scripts/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres} -d ${POSTGRES_DB:-ai_hr_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # In-Memory Cache & Message Broker: Redis 7
  # (Ports NOT published in production; accessible only via private network)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ai_hr_redis
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 15s
    networks:
      - ai_hr_network
    env_file:
      - ${ENV_FILE:-../../.env}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be explicitly set}
    volumes:
      - redis_data:/data
    command: >-
      sh -c "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD:?REDIS_PASSWORD must be explicitly set}\""
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Modular Monolith API: FastAPI Backend
  # (Ports NOT published in base/production; accessible only via private network)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: ai_hr_backend
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 15s
    networks:
      - ai_hr_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ${ENV_FILE:-../../.env}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------------------------
  # Asynchronous Background Worker: Celery Worker Fleet
  # (Ports NOT published; communicates strictly via internal Docker network.
  # Depends on backend: condition: service_healthy to ensure migrations finish first.)
  # ----------------------------------------------------------------------------
  celery_worker:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: ai_hr_celery_worker
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 30s
    networks:
      - ai_hr_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    env_file:
      - ${ENV_FILE:-../../.env}
    command: >-
      celery -A app.core.celery_app:celery_app worker
      --loglevel=INFO
      -Q default,document_processing,resume_parsing,embedding_generation,candidate_matching,notifications,reporting
      --concurrency=${CELERY_WORKER_CONCURRENCY:-2}
    healthcheck:
      test: ["CMD-SHELL", "python -m app.core.celery_health --workers --queues || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ----------------------------------------------------------------------------
  # Web Portal: Next.js 14 Frontend
  # (Ports NOT published in base/production; accessible only via private network)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: ai_hr_frontend
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 15s
    networks:
      - ai_hr_network
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - ${ENV_FILE:-../../.env}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  ai_hr_network:
    name: ai_hr_network
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
