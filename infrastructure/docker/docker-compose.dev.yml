version: "3.9"

services:
  backend:
    volumes:
      - ../../backend:/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      - ENVIRONMENT=development
      - DEBUG=true

  frontend:
    volumes:
      - ../../frontend:/app
      - /app/node_modules
      - /app/.next
    command: ["npm", "run", "dev"]
    environment:
      - NODE_ENV=development
